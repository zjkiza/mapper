name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests connect to the database by this host name (see tests/Resources/App/MapperBundleTestKernel.php).
  DB_HOST: mysql_bundle_1

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.dependencies == 'lowest' && ' / lowest' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*']
        dependencies: [highest]
        include:
          # Symfony 8 requires PHP 8.4
          - { php: '8.4', symfony: '8.1.*', dependencies: highest }
          # Lowest versions of the supported dependencies
          - { php: '8.2', symfony: '6.4.*', dependencies: lowest }
          # PHP 8.5 is not blocking until the whole development stack supports it
          - { php: '8.5', symfony: '7.4.*', dependencies: highest, experimental: true }
          - { php: '8.5', symfony: '8.1.*', dependencies: highest, experimental: true }

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: developer
          MYSQL_USER: developer
          MYSQL_PASSWORD: developer
          MYSQL_DATABASE: developer
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pdeveloper --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map the database host name
        run: echo "127.0.0.1 ${DB_HOST}" | sudo tee -a /etc/hosts

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, intl, mbstring, pdo_mysql, simplexml, tokenizer, xml
          coverage: none
          tools: composer:v2, flex

      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: developer
          MYSQL_USER: developer
          MYSQL_PASSWORD: developer
          MYSQL_DATABASE: developer
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pdeveloper --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Map the database host name
        run: echo "127.0.0.1 ${DB_HOST}" | sudo tee -a /etc/hosts

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, intl, mbstring, pdo_mysql, simplexml, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Validate composer.json and audit dependencies
        run: |
          composer validate --strict
          composer audit

      # PHPStan (Symfony extension) reads the compiled test container, so the test kernel has to boot first
      - name: Run tests
        run: vendor/bin/phpunit

      - name: PHPStan
        run: composer run phpstan

      - name: Psalm
        run: composer run psalm

      - name: PHPMD
        run: composer run phpmd

      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
